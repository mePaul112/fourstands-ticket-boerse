name: Feedback Nudge

# Serverseitiger taeglicher Stups bei neuem Feedback der FourStands-Ticketboerse.
# Laeuft unabhaengig von lokalen Geraeten in GitHub Actions.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = ~08:00 Europe/Berlin (Sommerzeit), 07:00 (Winter)
  workflow_dispatch: {}    # manuell ausloesbar (Actions-Tab -> Run workflow)

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Neue Feedback-Eintraege abfragen
        id: check
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Oeffentlicher, RLS-geschuetzter Anon-Key (steht auch in der oeffentlichen index.html)
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxY2F6dXFwZ2Nta3J5dmJrZ2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MTM1ODYsImV4cCI6MjA5NzI4OTU4Nn0.cpyjY1PjeWYVGKd15o9f3-3MAjk6Ze7FkmO1VX2QP0s
        # Kein Falsch-Negativ: "nichts Neues" darf nur bei bestaetigtem HTTP 200 und
        # einem echten JSON-Array herauskommen. Transport- und HTTP-Fehler brechen den
        # Lauf ab (rote Action + GitHub-Benachrichtigung), statt still 0 zu melden.
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          URL="https://tqcazuqpgcmkryvbkgkl.supabase.co/rest/v1/feedback?select=created_at,category,name,message&created_at=gte.${CUTOFF}&order=created_at.desc"

          # Body nach resp.json, Statuscode auf stdout. Kein --fail: sonst geht der
          # Fehlertext von PostgREST verloren, der die Ursache benennt.
          if ! HTTP=$(curl -sS --max-time 30 -o resp.json -w '%{http_code}' \
                        -H "apikey: ${SUPABASE_KEY}" \
                        -H "Authorization: Bearer ${SUPABASE_KEY}" "$URL"); then
            echo "::error::Supabase nicht erreichbar - Verbindung kam nicht zustande (curl-Transportfehler). Kein Rueckschluss auf neues Feedback moeglich."
            exit 1
          fi
          if [ "$HTTP" != "200" ]; then
            echo "::error::Supabase antwortete mit HTTP ${HTTP} statt 200 (haeufig - abgelaufener Anon-Key oder RLS). Kein Rueckschluss auf neues Feedback moeglich."
            head -c 500 resp.json || true
            exit 1
          fi
          if ! jq -e 'type=="array"' resp.json >/dev/null 2>&1; then
            echo "::error::Antwort ist kein JSON-Array - unerwartetes Format, Ergebnis nicht verwertbar."
            head -c 500 resp.json || true
            exit 1
          fi

          COUNT=$(jq 'length' resp.json)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ -n "${SMTP_PASSWORD:-}" ]; then echo "has_smtp=true" >> "$GITHUB_OUTPUT"; else echo "has_smtp=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "Neue Feedback-Eintraege der FourStands-Ticketboerse (letzte 24 h): ${COUNT}"
            echo ""
            jq -r '.[] | "- [\(.category // "?")] \(.name // "anonym"): \(.message // "")"' resp.json
            echo ""
            echo "Fuer die ausfuehrliche Analyse einfach in Claude nach dem Feedback fragen."
          } > body.txt
          echo "----- Vorschau (HTTP ${HTTP} bestaetigt) -----"
          cat body.txt

      - name: Stups per E-Mail (nur bei neuen Eintraegen)
        if: steps.check.outputs.count != '0' && steps.check.outputs.has_smtp == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.startmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "FourStands: ${{ steps.check.outputs.count }} neue Feedback-Eintraege"
          to: fourstands-ticketboerse@use.startmail.com
          from: FourStands Feedback <fourstands-ticketboerse@use.startmail.com>
          body: file://body.txt

      - name: Hinweis falls SMTP fehlt
        if: steps.check.outputs.has_smtp != 'true'
        # Block-Skalar (|): der Text enthaelt "Zeitraum: " - ein Doppelpunkt+Leerzeichen in einem
        # unquotierten YAML-Wert macht die ganze Datei ungueltig (Workflow startet dann gar nicht).
        run: |
          echo "::notice::SMTP-Secrets (SMTP_USERNAME/SMTP_PASSWORD) fehlen noch - es wurde keine E-Mail gesendet. Neue Eintraege im Zeitraum: ${{ steps.check.outputs.count }}"
